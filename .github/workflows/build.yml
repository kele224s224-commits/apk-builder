name: Fabriquer Vrai APK
on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration SDK Android
        uses: android-actions/setup-android@v3

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilation de l'APK Android
        env:
          CODE_APP: ${{ github.event.client_payload.code_html }}
          NOM_APP: ${{ github.event.client_payload.app_name }}
          ICONE_BASE64: ${{ github.event.client_payload.app_icon }}
        run: |
          mkdir -p myapp/www
          printf "%s" "$CODE_APP" > myapp/www/index.html
          cd myapp
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$NOM_APP" "com.studio.app" --web-dir www
          npx cap add android
          cd android

          # Conversion et injection de l'icône en vrai PNG certifié
          if [ -n "$ICONE_BASE64" ]; then
            python3 -m pip install --quiet Pillow
            python3 -c "
          import base64, io
          from PIL import Image
          data = '''$ICONE_BASE64'''.split(',')[-1]
          img = Image.open(io.BytesIO(base64.b64decode(data))).convert('RGBA')
          img.resize((192, 192)).save('icon.png', 'PNG')
          "
            for dir in app/src/main/res/mipmap-*; do
              cp icon.png "$dir/ic_launcher.png" || true
              cp icon.png "$dir/ic_launcher_round.png" || true
              cp icon.png "$dir/ic_launcher_foreground.png" || true
            done
          fi

          # Patch anti-conflit de bibliothèques
          sed -i "s/1.7.0/1.6.1/g" variables.gradle || true
          echo "android.enableJetifier=true" >> gradle.properties

          # Compilation officielle Gradle
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mise à disposition de l'APK téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.client_payload.app_name }} v${{ github.run_number }}
          files: myapp/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
