name: Fabriquer Vrai APK
on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration SDK Android
        uses: android-actions/setup-android@v3

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilation avec Permissions Caméra & Audio
        env:
          CODE_APP: ${{ github.event.client_payload.code_html }}
          NOM_APP: ${{ github.event.client_payload.app_name }}
          ICONE_BASE64: ${{ github.event.client_payload.app_icon }}
        run: |
          mkdir -p myapp/www
          printf "%s" "$CODE_APP" > myapp/www/index.html
          cd myapp
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          
          CLEAN_ID=$(echo "$NOM_APP" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          [ -z "$CLEAN_ID" ] && CLEAN_ID="app${{ github.run_number }}"
          PACKAGE_ID="com.kele.${CLEAN_ID}"

          npx cap init "$NOM_APP" "$PACKAGE_ID" --web-dir www
          npx cap add android
          cd android

          # Injection officielle des permissions Caméra et Audio dans AndroidManifest.xml
          python3 -c "
          with open('app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />
          '''
          if '<application' in content:
              content = content.replace('<application', perms + '    <application')
              with open('app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(content)
          "

          # Traitement sécurisé de l'icône
          if [ -n "$ICONE_BASE64" ]; then
            python3 -m pip install --quiet Pillow
            python3 -c "
          import os, base64, io
          from PIL import Image
          raw = os.environ.get('ICONE_BASE64', '').split(',')[-1]
          if raw:
              img = Image.open(io.BytesIO(base64.b64decode(raw))).convert('RGBA')
              img.resize((192, 192)).save('icon.png', 'PNG')
          "
            if [ -f icon.png ]; then
              for dir in app/src/main/res/mipmap-[hmx]*; do
                cp icon.png "$dir/ic_launcher.png" || true
                cp icon.png "$dir/ic_launcher_round.png" || true
                cp icon.png "$dir/ic_launcher_foreground.png" || true
              done
            fi
          fi

          # Patch anti-conflit de bibliothèques
          sed -i "s/1.7.0/1.6.1/g" variables.gradle || true
          echo "android.enableJetifier=true" >> gradle.properties

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mise à disposition du fichier APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.client_payload.app_name }} v${{ github.run_number }}
          files: myapp/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
