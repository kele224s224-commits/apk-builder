name: Kele Universal Builder

on:
  workflow_dispatch:
    inputs:
      code_html:
        description: "HTML/CSS/JS de l'application"
        required: true
        type: string
      app_name:
        description: "Nom de l'application"
        required: true
        type: string
      app_icon:
        description: "Icône PNG en data URL"
        required: false
        type: string

  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Variables d'environnement
        shell: bash
        env:
          PAYLOAD_NAME: ${{ github.event.client_payload.app_name }}
          INPUT_NAME: ${{ inputs.app_name }}
        run: |
          NAME="${PAYLOAD_NAME:-$INPUT_NAME}"
          if [ -z "$NAME" ]; then NAME="Kele App"; fi

          SAFE="$(echo "$NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/ /g' \
            | awk '{for(i=1;i<=NF;i++)printf "%s",$i}' \
            | cut -c1-20)"
          if [ -z "$SAFE" ]; then SAFE="keleapp"; fi

          PACKAGE="com.kele.studio.app${SAFE}"

          echo "APP_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$PACKAGE" >> "$GITHUB_ENV"
          echo "BUILD_ID=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Créer le projet Capacitor
        shell: bash
        env:
          PAYLOAD_CODE: ${{ github.event.client_payload.code_html }}
          INPUT_CODE: ${{ inputs.code_html }}
        run: |
          mkdir -p myapp/www
          printf '%s' "${PAYLOAD_CODE:-$INPUT_CODE}" > myapp/www/index.html

          cd myapp
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 >/dev/null 2>&1
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir www >/dev/null
          npx cap add android >/dev/null

      - name: Injecter les permissions Vidéo et Stockage dans le Manifeste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("myapp/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          perms = [
              "android.permission.INTERNET",
              "android.permission.READ_MEDIA_VIDEO",
              "android.permission.READ_MEDIA_AUDIO",
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.WRITE_EXTERNAL_STORAGE",
              "android.permission.WAKE_LOCK",
              "android.permission.VIBRATE"
          ]

          ins = "\n".join(f'    <uses-permission android:name="{x}" />' for x in perms)
          ins += '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'

          if "<application" in s:
              s = s.replace("<application", ins + "\n    <application", 1)

          p.write_text(s)
          PY

      - name: Injecter le code Java natif (Bridge VLC / Galerie)
        shell: bash
        run: |
          mkdir -p myapp/android/app/src/main/java/com/kele/bridge

          cat > myapp/android/app/src/main/java/com/kele/bridge/KeleBridgeActivity.java <<'JAVA'
          package com.kele.bridge;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Vibrator;
          import android.os.VibrationEffect;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class KeleBridgeActivity extends BridgeActivity {

              static final int REQ = 901;

              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  // Ajout de l'interface JavaScript KeleAndroid
                  getBridge()
                      .getWebView()
                      .addJavascriptInterface(
                          new API(this),
                          "KeleAndroid"
                      );

                  // Demande immédiate des permissions de lecture vidéo
                  requestStoragePermissions();
              }

              public void requestStoragePermissions() {
                  if (Build.VERSION.SDK_INT < 23) {
                      notifyReady();
                      return;
                  }

                  List<String> perms = new ArrayList<>();

                  if (Build.VERSION.SDK_INT >= 33) {
                      // Android 13+
                      if (checkSelfPermission(Manifest.permission.READ_MEDIA_VIDEO) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.READ_MEDIA_VIDEO);
                      }
                  } else {
                      // Android 12 et inférieur
                      if (checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          perms.add(Manifest.permission.READ_EXTERNAL_STORAGE);
                      }
                  }

                  if (!perms.isEmpty()) {
                      requestPermissions(perms.toArray(new String[0]), REQ);
                  } else {
                      notifyReady();
                  }
              }

              void notifyReady() {
                  getBridge().getWebView().post(() ->
                      getBridge().getWebView().evaluateJavascript(
                          "window.dispatchEvent(new Event('keleAndroidReady'))",
                          null
                      )
                  );
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  notifyReady();
              }

              /* =========================================================
                 API ACCESSIBLE DEPUIS LE JAVASCRIPT
              ========================================================= */
              public static class API {
                  final KeleBridgeActivity a;

                  API(KeleBridgeActivity act) {
                      this.a = act;
                  }

                  // 1. SCAN DE TOUTES LES VIDÉOS DU TÉLÉPHONE (STYLE VLC)
                  @JavascriptInterface
                  public String mediaList() {
                      JSONArray videos = new JSONArray();

                      String[] projection = {
                          MediaStore.Video.Media._ID,
                          MediaStore.Video.Media.DISPLAY_NAME,
                          MediaStore.Video.Media.MIME_TYPE,
                          MediaStore.Video.Media.DURATION,
                          MediaStore.Video.Media.SIZE
                      };

                      try (Cursor cursor = a.getContentResolver().query(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                              projection,
                              null,
                              null,
                              MediaStore.Video.Media.DATE_ADDED + " DESC"
                      )) {
                          if (cursor != null) {
                              while (cursor.moveToNext()) {
                                  long id = cursor.getLong(0);
                                  String name = cursor.getString(1);
                                  String mime = cursor.getString(2);
                                  long duration = cursor.getLong(3);
                                  long size = cursor.getLong(4);

                                  Uri videoUri = Uri.withAppendedPath(
                                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                                      String.valueOf(id)
                                  );

                                  JSONObject item = new JSONObject();
                                  item.put("id", id);
                                  item.put("name", name != null ? name : "Vidéo");
                                  item.put("kind", "video");
                                  item.put("type", mime != null ? mime : "video/mp4");
                                  item.put("duration", duration);
                                  item.put("size", size);
                                  item.put("src", videoUri.toString());

                                  videos.put(item);
                              }
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }

                      return videos.toString();
                  }

                  @JavascriptInterface
                  public String getMediaFiles() {
                      return mediaList();
                  }

                  // 2. LECTURE DE LA VIDÉO PAR LE LECTEUR DU TÉLÉPHONE
                  @JavascriptInterface
                  public void playVideo(String uriStr) {
                      try {
                          Uri uri = Uri.parse(uriStr);
                          Intent intent = new Intent(Intent.ACTION_VIEW);
                          intent.setDataAndType(uri, "video/*");
                          intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          a.startActivity(intent);
                      } catch (Exception e) {
                          try {
                              Intent fallback = new Intent(Intent.ACTION_VIEW, Uri.parse(uriStr));
                              fallback.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              a.startActivity(fallback);
                          } catch (Exception ignored) {}
                      }
                  }

                  @JavascriptInterface
                  public void open(String uriStr) {
                      playVideo(uriStr);
                  }

                  // 3. DEMANDER LES PERMISSIONS SI REFUSÉES
                  @JavascriptInterface
                  public void requestPermissions() {
                      a.runOnUiThread(a::requestStoragePermissions);
                  }

                  // 4. VIBRATION
                  @JavascriptInterface
                  public void vibrate(long ms) {
                      Vibrator v = (Vibrator) a.getSystemService(Context.VIBRATOR_SERVICE);
                      if (v != null) {
                          if (Build.VERSION.SDK_INT >= 26) {
                              v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE));
                          } else {
                              v.vibrate(ms);
                          }
                      }
                  }

                  // 5. INFOS APPAREIL
                  @JavascriptInterface
                  public String deviceInfo() {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("manufacturer", Build.MANUFACTURER);
                          o.put("model", Build.MODEL);
                          o.put("android", Build.VERSION.RELEASE);
                          o.put("sdk", Build.VERSION.SDK_INT);
                          return o.toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }
              }
          }
          JAVA
