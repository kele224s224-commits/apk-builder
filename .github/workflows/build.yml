name: Fabriquer Vrai APK
on:
  workflow_dispatch:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configuration SDK Android
        uses: android-actions/setup-android@v3

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compilation avec Passerelle Galerie Android
        env:
          CODE_APP: ${{ github.event.client_payload.code_html }}
          NOM_APP: ${{ github.event.client_payload.app_name }}
          ICONE_BASE64: ${{ github.event.client_payload.app_icon }}
        run: |
          mkdir -p myapp/www
          printf "%s" "$CODE_APP" > myapp/www/index.html
          cd myapp
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          
          CLEAN_ID=$(echo "$NOM_APP" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          [ -z "$CLEAN_ID" ] && CLEAN_ID="app${{ github.run_number }}"
          PACKAGE_ID="com.kele.${CLEAN_ID}"

          npx cap init "$NOM_APP" "$PACKAGE_ID" --web-dir www
          npx cap add android
          cd android

          # 1. Permissions Caméra et Stockage
          python3 -c "
          with open('app/src/main/AndroidManifest.xml', 'r') as f:
              c = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
          '''
          if '<application' in c:
              c = c.replace('<application', perms + '    <application')
              with open('app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(c)
          "

          # 2. Injection du Pont Natif vers la Galerie (MediaStore / DCIM)
          python3 -c "
          import glob
          files = glob.glob('app/src/main/java/**/MainActivity.java', recursive=True)
          if files:
              target = files[0]
              with open(target, 'r') as f:
                  first_line = f.readline()
              
              java_code = f'''{first_line}
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.os.Environment;
          import android.util.Base64;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new NativeBridge(), \"AndroidGallery\");
              }}

              public class NativeBridge {{
                  @JavascriptInterface
                  public void saveToGallery(String base64Data, String filename, String mimeType) {{
                      try {{
                          byte[] bytes = Base64.decode(base64Data.contains(\",\") ? base64Data.split(\",\")[1] : base64Data, Base64.DEFAULT);
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, filename);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                          
                          Uri collection;
                          if (mimeType.startsWith(\"video\")) {{
                              values.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_DCIM + \"/Camera\");
                              collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                          }} else {{
                              values.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_DCIM + \"/Camera\");
                              collection = MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                          }}

                          Uri item = getContentResolver().insert(collection, values);
                          if (item != null) {{
                              try (OutputStream out = getContentResolver().openOutputStream(item)) {{
                                  out.write(bytes);
                              }}
                              runOnUiThread(() -> Toast.makeText(MainActivity.this, \"✓ Enregistré dans la Galerie !\", Toast.LENGTH_SHORT).show());
                          }}
                      }} catch (Exception e) {{
                          e.printStackTrace();
                      }}
                  }}
              }}
          }}'''
              with open(target, 'w') as f:
                  f.write(java_code)
          "

          # 3. Icône personnalisée
          if [ -n "$ICONE_BASE64" ]; then
            python3 -m pip install --quiet Pillow
            python3 -c "
          import os, base64, io
          from PIL import Image
          raw = os.environ.get('ICONE_BASE64', '').split(',')[-1]
          if raw:
              img = Image.open(io.BytesIO(base64.b64decode(raw))).convert('RGBA')
              img.resize((192, 192)).save('icon.png', 'PNG')
          "
            if [ -f icon.png ]; then
              for dir in app/src/main/res/mipmap-[hmx]*; do
                cp icon.png "$dir/ic_launcher.png" || true
                cp icon.png "$dir/ic_launcher_round.png" || true
                cp icon.png "$dir/ic_launcher_foreground.png" || true
              done
            fi
          fi

          sed -i "s/1.7.0/1.6.1/g" variables.gradle || true
          echo "android.enableJetifier=true" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mise à disposition du fichier APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.client_payload.app_name }} v${{ github.run_number }}
          files: myapp/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
